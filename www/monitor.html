<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta content="width=1000,initial-scale=1.0" name="viewport">
<title> CAMERA PREVIEW </title>
<link href="/a/bootstrap.min.css" rel="stylesheet">
<!-- <link href="/a/bootstrap.override.css" rel="stylesheet"> -->
<script src="/a/bootstrap.bundle.min.js"></script>
<script src="/a/main.js"></script>
<script src="./monitor_set.js"></script>  <!-- // preset values -->
</head>

<body id="top">
<div class="container">
<nav class="navbar navbar-expand-lg">
<a class="btn btn-dark border ms-2" style="marginRight: 200px;"><img alt="" height="32" src="/a/logo.svg" width="216"></a>
<button type="button" class="btn btn-secondary" style="width: 120px; height: 40px; border: 1px solid #909020;" onclick="generateElements()">Display Pans</button>
<input type="number" id="elementCount" value="4" min="1" max="16" style="width: 60px; height: 35px; border: 2px solid #505050;" >
<button type="button" class="btn btn-secondary" style="width: 85px; height: 35px; border: 1px solid #909020;" onclick="generateElements()">Columns</button>
<input type="number" id="num_col" value="2" min="1" max="8" style="width: 60px; height: 35px; border: 2px solid #505050;" >
<button type="button" class="btn btn-secondary" id="save-urls-config" style="width: 120px; height: 40px; border: 2px solid orange; background: darkblue;">Save Config</button>
</nav>
</div> 
</body>

<main>
<div class="container" id="video_view">
<!-- _preview.cgi -->
<div class="modal fade" id="mdPreview" tabindex="-1" aria-labelledby="mdlPreview" aria-hidden="true">
<div class="modal-dialog modal-fullscreen"><div class="modal-content"><div class="modal-header">
<h1 class="modal-title fs-4" id="mdlPreview">Full screen preview</h1>
<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body text-center">
<img id="preview_fullsize" src="/a/nostream.webp" alt="Image: Stream Preview" class="img-fluid">
</div>
</div>
</div>
</div>

<div class="btn-toolbar" role="toolbar" style="display: flex; gap: 10px;">
<button id="zoom_btn" type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#mdPreview" title="Full-screen" style="width: 45px; height: 45px; border: 2px solid DimGray; background: darkblue; border-radius: 5px;"><img src="/a/zoom.svg" alt="Zoom" width="40" height="40" class="img-fluid icon-sm"></button>
<button id="site_btn" type="button" class="btn btn-secondary" title="Camera Site" style="width: 45px; height: 45px; border: 2px solid DimGray; background: darkblue; border-radius: 5px;"><img src="/a/cam_select.svg" alt="Site" width="40" height="40" class="img-fluid icon-lg"></button>
<a id="download_image" href="" target="_blank" class="btn btn-dark border mb-2" title="Save image" style="width: 45px; height: 45px; border: 2px solid DimGray; background: darkblue"; border-radius: 5px;><img src="/a/download.svg" alt="Save image" width="40" height="40" class="img-fluid icon-sm"></a>

<!-- camera selection, dynamic size -->
<div class="btn-group mb-3" role="group" id="cam_select">
<div id="cam_select_btn">
</div>
</div>


<div class="row row-col-2 no-gutters" style="marginLeft: 20px; marginRight:0; marginBottom: 0" >
<label type="button" class="btn btn-secondary" style="width: 60px; height: 35px; border: 1px solid #909020;" >PTZ</label>

<div class="col mb-3">
<div class="ml-0 row-cols-2" id="ptz" style="width: 146px; height: 95px; border: 2px solid #805080;">
<div class="col mb-0"  style="display: flex; gap: 0px;">
<label class="btn btn-dark border ms-2" style="width: 40px; height: 30px;  color: darkgray; marginLeft: 0px; background: darkgray"; border-radius: 2px;>^</label>
<a id="motor_up" onclick="openAndClose(event,motor_up_url)" target="_self" class="btn btn-dark border ms-2" title="up" style="width: 40px; height: 30px; MarginLeft: 0; background: darkblue"; border-radius: 2px;>^</a>
<label class="btn btn-dark border ms-2" style="width: 40px; height: 30px; color: darkgray; marginLeft: 0px; background: darkgray"; border-radius: 2px;>^</label>
</div>
<div class="col mb-0"  style="display: flex; gap: 0px;">
<a id="motor_left" onclick="openAndClose(event,motor_left_url)" target="_self" class="btn btn-dark border ms-2" title="left" style="width: 40px; height: 30px; marginLeft: 0; paddingLeft: 0; background: darkblue"; border-radius: 2px;><</a>
<a id="motor_home" onclick="openAndClose(event,motor_home_url)" target="_self" class="btn btn-dark border ms-2" title="Home" style="width: 40px; height: 30px; marginLeft: 0; paddingLeft: 0; background: darkblue"; border-radius: 2px;>H</a>
<a id="motor_right" onclick="openAndClose(event,motor_right_url)" target="_self" class="btn btn-dark border ms-2" title="right" style="width: 40px; height: 30px; marginLeft: 0px; background: darkblue"; border-radius: 2px;>></a>
</div>
<div class="col mb-0"  style="display: flex; gap: 0px;">
<label class="btn btn-dark border ms-2" style="width: 40px; height: 30px; color: darkgray; marginLeft: 0px; background: darkgray"; border-radius: 2px;>^</label>
<a id="motor_down" onclick="openAndClose(event,motor_down_url)" target="_self" class="btn btn-dark border ms-2" title="down" style="width: 40px; height: 30px; marginLeft: 0px; background: darkblue; display: inline-block; transform: scaleY(-1); border-radius: 2px;">^</a>
<label width=10  height=10 class="btn btn-dark border ms-2" style="width: 40px; height: 30px; color: darkgray; marginLeft: 0px; background: darkgray"; border-radius: 2px;>^</label>
</div>

</div>
</div>

<style>
.no-gutters {
  margin-right: 0px;
  margin-left: 0px;
  row-gap: 10px;

  > .col,
  > [class*="col-"] {
    padding-right: 0px;
    padding-left: 0px;
  }
}

<!-- variable input field -->
input {
  field-sizing: content;
  min-width: 40px; 
  max-width: 400px; 
  height: 30px;
  padding-left: 10px;
  padding-right: 10px;
}

</style>

</div>
</div>

<!-- camera viewing pans, dynamic size -->
<p class="small"></p>
<div class="row row-cols-2 row-cols-lg-2" id="view_area">

</div>

</div>
</div>

</div>

<script>
const http = "http://";
var urls=[
	'',
	'',
	'',
	'',
	''
];

var site_url;
var active = 1;
var motor_up_url;
var motor_down_url;
var motor_left_url;
var motor_right_url;
var motor_home_url;

preset();  // from file:  monitor_set.js

const controller = new AbortController();

function generateElements() {
  const container = document.getElementById("view_area");
  const select = document.getElementById("cam_select_btn");
  const count = document.getElementById(`elementCount`).value;
  
  // Clear any existing elements first
  container.innerHTML = ''; 
  select.innerHTML = ''; 

  // Generate the new variable number of elements
  for (let i = 1; i <= count; i++) {
	// *** camera select 
	//<input type="radio" class="btn-check" name="preview_source" id="preview_source_1" value="1" checked>
	//<label class="btn btn-outline-primary" for="preview_source_1">Camera 1</label>
    	const newCam = document.createElement('input');
    	const newCamLabel = document.createElement('label');
    	newCamLabel.textContent = `Camera ${i}`;
    	newCam.type = 'radio';
    	newCam.className = 'btn-check';
    	newCamLabel.className = 'btn btn-outline-primary';
    	newCam.id = 'preview_source_'+i;
    	newCam.name = 'preview_source';
    	newCamLabel.htmlFor = 'preview_source_'+i;
    	newCam.value = i;
    	newCamLabel.style.width = `80px`;
    	select.appendChild(newCam);
    	select.appendChild(newCamLabel);

	// *** preview lebal and input
	// <div class="col mb-3">
    	const newDiv = document.createElement('div');
    	newDiv.className = 'col mb-3';
    	container.appendChild(newDiv);
	// <label for="cam_1">Camera 1: </label>
    	const newLabel= document.createElement('label');
    	newLabel.textContent = `Camera #${i}  `;
    	newLabel.style.padding = `10px`;
    	newLabel.className = 'label';
    	newDiv.appendChild(newLabel);
	// <input type="text" id="cam_1" name="cam_1" value="192.168.1.100/x/ch0.mjpg">
    	const newInput= document.createElement('input');
    	newInput.textContent = `Camera ${i}  `;
    	newInput.className = 'input';
    	newInput.id = 'cam_'+i;
    	newInput.value = urls[i];
    	newDiv.appendChild(newInput);
	//  *** preview pan
	// <img id="preview1" src=#cam_1 class="img-fluid" alt="Image 1 Preview">
    	const newPreview = document.createElement('img');
	newPreview.className = 'img-fluid';
	newPreview.id = "preview"+i;
	newPreview.src= http+newInput.value;
    	newDiv.appendChild(newPreview);
  }
  controller.abort();
  set_visibility();  // preview pans
  set_cam_select();
  preview_source_1.click();
}


$('#elementCount').addEventListener('change', () => 
{
	generateElements();
});

$('#num_col').addEventListener('change', () => 
{
	view_area.className = "row row-cols-"+$('#num_col').value+" row-cols-lg-"+$('#num_col').value;
});

$('#site_btn').addEventListener('click', () => 
{
	ToSite(urls[active]);
});

$('#save-urls-config').addEventListener('click', () => 
{
	saveURLs();
});

// preview pans
function set_visibility()
{
	for (let i = 1; i <= elementCount.value; i++) {
   	    $(`#preview${i}`).src = http+($(`#cam_${i}`).value);
  	    $('#cam_'+i).addEventListener('change', () => 
    	    { 
		if ($(`#cam_${i}`).value == "") {
			$(`#preview${i}`).style.visibility = 'hidden';
			$(`#preview${i}`).style.display= 'none';
		}
		else {
			$(`#preview${i}`).style.visibility = 'visible';
			$(`#preview${i}`).style.display = 'block';
			$(`#preview${i}`).src = http+($(`#cam_${i}`).value);
		}
		urls[i] = $(`#cam_${i}`).value;
     	    });
	}
}

//  camera select
function set_cam_select()
{
	for (let i = 1; i <= elementCount.value; i++) {
    	    $('#preview_source_'+i).addEventListener('click', () => 
	    { 
		$(`#preview${active}`).style="border: 3px solid gray";
		$(`#preview${i}`).style="border: 3px solid orange";
	   	$('#preview_fullsize').src=http+($(`#cam_${i}`).value);;
		$('#mdlPreview').textContent = "Preview of Camera #"+i;
		//$(`#preview${active}`).checked = false;
		//$(`#preview${i}`).checked = true;
		active = i;
		site_url = http+urls[i].substring(0, urls[i].indexOf("/"));
		let s, s1;
		s = urls[i].indexOf("mjpg");
		s1 = urls[i].substring(s-2,s-1);
    		document.getElementById("download_image").href = site_url+"/x/image.cgi?channel="+s1;
    		motor_up_url = site_url+"/x/json-motor.cgi?d=g&x=0&y=-100";
    		motor_down_url = site_url+"/x/json-motor.cgi?d=g&x=0&y=100";
    		motor_left_url = site_url+"/x/json-motor.cgi?d=g&x=-100&y=0";
    		motor_right_url = site_url+"/x/json-motor.cgi?d=g&x=100&y=0";
    		motor_home_url = site_url+"/x/json-motor.cgi?d=r";
	     });
	}
}

function ToSite(url) {
	window.open(site_url, '_blank');
}

// Save URL array from localstroage
function saveURLs() {
            // Save to local storage
            localStorage.setItem('urls', JSON.stringify(urls));
            alert('URLs saved successfully!');
}

// Get URL array from localstroage
function getURLs() {
            // Retrieve from local storage
            const dataString = localStorage.getItem('urls');
            
            if (dataString) {
                const dataArray = JSON.parse(dataString);
                console.log('Retrieved Array:', dataArray);
                // alert('URLs Retrieved, items ' + dataArray);
		urls = dataArray;
            } else {
                alert('No data found in localStorage. Click save first.');
            }
}

async function openAndClose(event,url) {
	event.preventDefault(); // Stop default link behavior
	myWindow = window.open(url, '_blank'); // Open the new link
	await sleep(100); // target may need time to process the command
	myWindow.close(); // Try to close the current page
}

getURLs();
generateElements();

set_visibility();
set_cam_select();
preview_source_1.click();

window.onload = 
    function() { 
  	const viewArea = document.getElementById("view_area");
	const image = document.querySelectorAll('img');

	let clickTimer;

	image.forEach(x => {
    		x.addEventListener('dblclick', handleMouseDoubleClick);
	});

	function handleMouseDoubleClick(e) {
		clearTimeout(clickTimer);

	    switch(e.currentTarget.id) {
		case "preview1":
			$(`#preview_source_1`).click();
			break;
		case "preview2":
			$(`#preview_source_2`).click();
			break;
		case "preview3":
			$(`#preview_source_3`).click();
			break;
		case "preview4":
			$(`#preview_source_4`).click();
			break;
		}

	site_url = http+urls[active].substring(0, urls[active].indexOf("/"));
	window.open(site_url, '_blank');
        }

	image.forEach(x => {
    		x.addEventListener('click', handleMouseClick);
	});

	function zoom(id) {
	    switch(id) {
		case "preview1":
			$(`#preview_source_1`).click();
			zoom_btn.click();
			break;
		case "preview2":
			$(`#preview_source_2`).click();
			zoom_btn.click();
			break;
		case "preview3":
			$(`#preview_source_3`).click();
			zoom_btn.click();
			break;
		case "preview4":
			$(`#preview_source_4`).click();
			zoom_btn.click();
			break;
		}
	}
	function handleMouseClick(e) {
	    	var id = e.currentTarget.id; 

		clearTimeout(clickTimer);
		clickTimer = setTimeout(zoom, 250, id);
        }
	//  keyboard function
        video_view.addEventListener("keyup", function (e) {
                 // <27>: escape key Code
                 if (e.keyCode == 27) {
                 }
		switch(e.keyCode) {
			case 37:
				motor_left.click();
				break;
			case 38:
				motor_up.click();
				break;
			case 39:
				motor_right.click();
				break;
			case 40:
				motor_down.click();
				break;
			case 72:
				motor_home.click();
				break;
			case 70:
				preview_fullsize.click();
				break;
			case 68:
				download_image.click();
				break;
			case 83:
				site_btn.click();
				break;
			case 32:
				motor_left.click();
				break;
		}
		if ((e.keyCode) >= 49 && (e.keyCode <= 57)) {  // 1-9
			$(`#preview_source_`+String.fromCharCode(e.keyCode)).click();
			//zoom_btn.click();
		} else  // 65=A, 90=Z
		if ((e.keyCode) >= 65 && (e.keyCode <= 71)) {  // A-G = 10 to 16
			let i = e.keyCode - 55;
			$(`#preview_source_`+i).click();
			//zoom_btn.click();
		}
        });
}
</script>

</main>

</html>
