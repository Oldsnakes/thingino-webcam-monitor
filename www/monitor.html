<script>
const http = "http://";
var urls=[
	'',
	'',
	'',
	'',
	''
];

var site_url;
var ch = 0;	// video channel
var s_ch = 0;  // sensor channel
var active = 1;
var motor_up_url;
var motor_down_url;
var motor_left_url;
var motor_right_url;
var motor_home_url;
var command_mode = false;

const cmd_params = ['ir850_on', 'white_on', 'ircut_on', 'bw_mode_on', 'motion_on', 'ir850_off', 'white_off', 'ircut_off', 'bw_mode_off', 'motion_off'];

var clickTimer;

const controller = new AbortController();

function generateElements() {
   const container = document.getElementById("view_area");
   const select = document.getElementById("cam_select_btn");
   const count = document.getElementById(`elementCount`).value;
  
   // Clear any existing elements first
   container.innerHTML = ''; 
   select.innerHTML = ''; 

   // Generate the new variable number of elements
   for (let i = 1; i <= count; i++) {
	// *** camera select 
	//<input type="radio" class="btn-check" name="preview_source" id="preview_source_1" value="1" checked>
	//<label class="btn btn-outline-primary" for="preview_source_1">Camera 1</label>
    	const newCam = document.createElement('input');
    	const newCamLabel = document.createElement('label');
    	newCamLabel.textContent = `Camera ${i}`;
    	newCam.type = 'radio';
    	newCam.className = 'btn-check';
    	newCamLabel.className = 'btn btn-outline-primary';
    	newCam.id = 'preview_source_'+i;
    	newCam.name = 'preview_source';
    	newCamLabel.htmlFor = 'preview_source_'+i;
    	newCam.value = i;
    	newCamLabel.style.width = `80px`;
    	select.appendChild(newCam);
    	select.appendChild(newCamLabel);

	// *** preview lebal and input
	// <div class="col mb-3">
    	const newDiv = document.createElement('div');
    	newDiv.className = 'col mb-3';
    	container.appendChild(newDiv);
	// <label for="cam_1">Camera 1: </label>
    	const newLabel= document.createElement('label');
    	newLabel.textContent = `Camera #${i}  `;
    	newLabel.style.padding = `10px`;
    	newLabel.className = 'label';
    	newDiv.appendChild(newLabel);
	// <input type="text" id="cam_1" name="cam_1" value="192.168.1.100/x/ch0.mjpg">
    	const newInput= document.createElement('input');
    	newInput.textContent = `Camera ${i}  `;
    	newInput.className = 'input';
    	newInput.id = 'cam_'+i;
    	newInput.value = urls[i];
    	newDiv.appendChild(newInput);
	//  *** preview pan
	// <img id="preview1" src=#cam_1 class="img-fluid" alt="Image 1 Preview">
    	const newPreview = document.createElement('img');
	newPreview.className = 'img-fluid';
	newPreview.id = "preview"+i;
	newPreview.src= check_url(newInput.value);
    	newDiv.appendChild(newPreview);
   }
}

function view_init()
{
  controller.abort();
  set_visibility();  // preview pans
  set_cam_select();
  preview_source_1.click();
}

function mouse_init()
{
	const image = document.querySelectorAll('img');
	image.forEach(x => {
    		x.addEventListener('dblclick', handleMouseDoubleClick);
	});
	image.forEach(x => {
    		x.addEventListener('click', handleMouseClick);
	});
}


$('#elementCount').addEventListener('change', () => 
{
	generateElements();
	view_init();
	mouse_init();
});

$('#num_col').addEventListener('change', () => 
{
	view_area.className = "row row-cols-"+$('#num_col').value+" row-cols-lg-"+$('#num_col').value;
});

$('#site_btn').addEventListener('click', () => 
{
	ToSite(urls[active]);
});

$('#save-urls-config').addEventListener('click', () => 
{
	saveURLs();
});

$('#cmd').addEventListener('change', () => 
{
	excute_cmd();
});

let s_sel = '"sensor":{"select":';


cmd_params.forEach((x) => {
	const el = $(`#${x}`);
	if (!el) {
		console.debug(`element ${x} not found`);
		return;
	}

	el.addEventListener('click', () => 
	{
		let cmd = el.dataset.cmd;
		let mode = el.dataset.mode;
		sendJson('{' +cmd+mode+ '},' +s_sel+s_ch+ '}}');
	});
});

function sendJson(payload)
{
	let json_url = check_url(site_url+'/x/json-prudynt-1.cgi')
	let out_string = json_url+'?'+payload;
	console.log(out_string);
	openAndCloseJson(out_string);
}

function excute_cmd()
{
	$(`#responseMsg`).value = "..."; 

	let json_url = check_url(site_url_in.value+'/x/json-prudynt-1.cgi')
	let out_string = json_url+'?'+(cmd.value);
	console.log(out_string);
	openAndCloseJson(out_string);
	//let msg = sendJsonToSite(site_url_in.value, cmd.value);
}

// set preview pans
function set_visibility()
{
	for (let i = 1; i <= elementCount.value; i++) {
   	    $(`#preview${i}`).src = check_url($(`#cam_${i}`).value);
  	    $('#cam_'+i).addEventListener('change', () => 
    	    { 
		if ($(`#cam_${i}`).value == "") {
			$(`#preview${i}`).style.visibility = 'hidden';
			$(`#preview${i}`).style.display= 'none';
		}
		else {
			$(`#preview${i}`).style.visibility = 'visible';
			$(`#preview${i}`).style.display = 'block';
			$(`#preview${i}`).src = check_url($(`#cam_${i}`).value);
		}
		urls[i] = $(`#cam_${i}`).value;
     	    });
	}
}

//  camera select
function set_cam_select()
{
	for (let i = 1; i <= elementCount.value; i++) {
    	    $('#preview_source_'+i).addEventListener('click', () => 
	    { 
		$(`#preview${active}`).style="border: 3px solid gray";
		$(`#preview${i}`).style="border: 3px solid orange";
	   	$('#preview_fullsize').src=check_url($(`#cam_${i}`).value);;
		$('#mdlPreview').textContent = "Preview of Camera #"+i;
		//$(`#preview${active}`).checked = false;
		//$(`#preview${i}`).checked = true;
		active = i;
		site_url = check_url(urls[i].substring(0, urls[i].indexOf("/")));
		let s = urls[i].indexOf("mjpg");
		ch = urls[i].substring(s-2,s-1);
		s_ch = Number(ch)+1;
    		document.getElementById("download_image").href = site_url+"/x/image.cgi?channel="+ch;
    		motor_up_url = site_url+"/x/json-motor.cgi?d=g&x=0&y=-100";
    		motor_down_url = site_url+"/x/json-motor.cgi?d=g&x=0&y=100";
    		motor_left_url = site_url+"/x/json-motor.cgi?d=g&x=-100&y=0";
    		motor_right_url = site_url+"/x/json-motor.cgi?d=g&x=100&y=0";
    		motor_home_url = site_url+"/x/json-motor.cgi?d=r";
	     });
	}
}

function ToSite(url) {
	window.open(site_url, '_blank');
}

// Save URL array from localstroage
function saveURLs() {
            // Save to local storage
            localStorage.setItem('urls', JSON.stringify(urls));
            alert('URLs saved successfully!');
}

// Get URL array from localstroage
function getURLs() {
            // Retrieve from local storage
            const dataString = localStorage.getItem('urls');
            
            if (dataString) {
                const dataArray = JSON.parse(dataString);
                console.log('Retrieved Array:', dataArray);
                // alert('URLs Retrieved, items ' + dataArray);
		urls = dataArray;
            } else {
                alert('No data found in localStorage. Click save first.');
            }
}
function check_url(url)
{
	if (url.substring(0, url.indexOf(":")) != "http")
		url = http+url;
	return url;
}

async function openAndCloseJson(url) {
	responseMsg.value = ".....";
	site_url_in.value = site_url;
	myWindow = window.open(url, '_blank'); // Open the new link
	await sleep(200); // target may need time to process the command
	if (myWindow != null) {
		let aa = myWindow.document.querySelector("pre");
		if (aa != null) {
			let dd = aa.outerText;
			let bb = dd.indexOf("\n");
			let cc = dd.substring(bb+1);
			responseMsg.value = cc;
		} 
	}
	else {
		responseMsg.value = site_url+" not accessible!";
	}
	myWindow.close(); // Try to close the current page
}

async function openAndClose(event,url) {
	event.preventDefault(); // Stop default link behavior
	myWindow = window.open(url, '_blank'); // Open the new link
	await sleep(100); // target may need time to process the command
	myWindow.close(); // Try to close the current page
}

// send a JSON string to url cgi program, only work to the web server
async function sendJsonToSite(url, payload) {
	let endpoint = check_url(url+'/x/json-motor.cgi');
	// let endpoint = check_url(url+'/x/json-prudynt-1.cgi');
	let msg;
	console.log(ts(), url, '===>', payload);
	try {
		const response = await fetch(endpoint, {
			method: 'POST',
			headers: { 'Content-Type': 'text/plain' },
			//headers: { 'Content-Type': 'application/json' },
			body: payload
		});
		if (!response.ok) throw new Error(`HTTP ${response.status}`);
		const contentType = response.headers.get('content-type');
		if (contentType?.includes('application/json')) {
			msg = await response.json();
			responseMsg.value = JSON.stringify(msg);
			console.log(ts(), '<===', JSON.stringify(msg));
		//	handleMessage(msg);
		}
	} catch (err) {
		console.error('Send error', err);
	}
	return msg;
}


function keyboard_init()
{
    cmd.addEventListener("keyup", function (e) {
        if (e.keyCode == 13) {   // [enter]
		excute_cmd();
        }
    });
    //  keyboard function
    video_view.addEventListener("keyup", function (e) {
        // <27>: escape key Code
        if (e.keyCode == 27) {
        }
    if (document.activeElement.className != "input")
	switch(e.keyCode) {
		case 37:
			motor_left.click();
			break;
		case 38:
			motor_up.click();
			break;
		case 39:
			motor_right.click();
			break;
		case 40:
			motor_down.click();
			break;
		case 72:
			motor_home.click();
			break;
		case 70:
			zoom_btn.click();
			//preview_fullsize.click();
			break;
		case 68:
			download_image.click();
			break;
		case 83:
			site_btn.click();
			break;
		case 32:
			preview_fullsize.click();
			break;
	}
	if ((e.keyCode) >= 49 && (e.keyCode <= 57)) {  // 1-9
		$(`#preview_source_`+String.fromCharCode(e.keyCode)).click();
		//zoom_btn.click();
	} else  // 65=A, 90=Z
	if ((e.keyCode) >= 65 && (e.keyCode <= 71)) {  // A-G = 10 to 16
		let i = e.keyCode - 55;
		$(`#preview_source_`+i).click();
		//zoom_btn.click();
	} else  // alt-K(k) key to enable JSON string command box
	if ((e.altKey == true) && ((e.keyCode) == 75)) {
		if (command_mode == false) {
			command_mode = true;
			command_box.style.visibility = "visible";
			command_box.style.display= "block";
		} else {
			command_mode = false;
			command_box.style.display= "none";
		}	
	}
    });
}

function handleMouseDoubleClick(e) {
    clearTimeout(clickTimer);

    switch(e.currentTarget.id) {
	case "preview1":
		$(`#preview_source_1`).click();
		break;
	case "preview2":
		$(`#preview_source_2`).click();
		break;
	case "preview3":
		$(`#preview_source_3`).click();
		break;
	case "preview4":
		$(`#preview_source_4`).click();
		break;
    }

    site_url = check_url(urls[active].substring(0, urls[active].indexOf("/")));
    window.open(site_url, '_blank');
}

function zoom(id) {
    switch(id) {
	case "preview1":
		$(`#preview_source_1`).click();
		zoom_btn.click();
		break;
	case "preview2":
		$(`#preview_source_2`).click();
		zoom_btn.click();
		break;
	case "preview3":
		$(`#preview_source_3`).click();
		zoom_btn.click();
		break;
	case "preview4":
		$(`#preview_source_4`).click();
		zoom_btn.click();
		break;
    }
}

function handleMouseClick(e) {
    	var id = e.currentTarget.id; 

	clearTimeout(clickTimer);
	clickTimer = setTimeout(zoom, 250, id);
}

window.onload = 
    function() { 
	getURLs();
	generateElements();
	view_init();
	mouse_init();
	keyboard_init();
	set_visibility();
	set_cam_select();
	preview_source_1.click();
	command_mode = false;
	command_box.style.display= "none";
    };

</script>
